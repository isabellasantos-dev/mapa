<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Geocodificador Mapbox</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
}

textarea{
    width:100%;
    height:250px;
}

button{
    padding:10px;
    margin-top:10px;
    margin-right:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

#status{
    margin-top:15px;
    font-weight:bold;
    color:#0066cc;
}

</style>

</head>

<body>

<h2>Geocodificador de Endereços</h2>

<h3>Busca Manual</h3>

<p>Cole um endereço por linha:</p>

<textarea id="enderecos"></textarea>

<br>

<button onclick="buscarCoordenadas()">
Buscar Coordenadas
</button>

<hr>

<h3>Importar Planilha</h3>

<input
type="file"
id="arquivoExcel"
accept=".xlsx,.csv"
/>

<br><br>

<button onclick="processarPlanilha()">
Processar Planilha
</button>

<div id="status"></div>

<div id="resultado"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>

const TOKEN = "pk.eyJ1IjoiaXNhYmVsbGFtZW5kZXMiLCJhIjoiY211MnAxcDNrMDF6azJ4cHMwb2k5ejA4NCJ9.ViXe6qaQ5dYB0iKFljqIwQ";

const cacheGeocode = {};

let resultadosPlanilha = [];

async function geocodificarEndereco(endereco){

    const chave =
        endereco
        .trim()
        .toUpperCase();

    if(cacheGeocode[chave]){
        return cacheGeocode[chave];
    }

    try{

        const params =
            new URLSearchParams({

                access_token: TOKEN,

                language: "pt",

                country: "br",

                limit: 5

            });

        const url =
            `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(endereco)}.json?${params}`;

        const resposta =
            await fetch(url);

        if(!resposta.ok){

            throw new Error(
                `Erro HTTP ${resposta.status}`
            );

        }

        const dados =
            await resposta.json();

        if(
            dados.features &&
            dados.features.length > 0
        ){

            let melhor =
                dados.features[0];

            for(const item of dados.features){

                if(
                    (item.relevance || 0)
                    >
                    (melhor.relevance || 0)
                ){
                    melhor = item;
                }

            }

            const retorno = {

                latitude:
                    melhor.center[1],

                longitude:
                    melhor.center[0],

                matched_address:
                    melhor.place_name,

                status:
                    "success"

            };

            cacheGeocode[chave] =
                retorno;

            return retorno;

        }

        return {

            latitude:"",
            longitude:"",
            matched_address:"",
            status:"not_found"

        };

    }catch(e){

        return {

            latitude:"",
            longitude:"",
            matched_address:"",
            status:"error"

        };

    }

}

async function buscarCoordenadas(){

    const linhas =
        document
        .getElementById("enderecos")
        .value
        .split("\n")
        .filter(x => x.trim());

    let html = `
    <table>
        <tr>
            <th>Endereço</th>
            <th>Latitude</th>
            <th>Longitude</th>
            <th>Status</th>
        </tr>
    `;

    for(const endereco of linhas){

        const r =
            await geocodificarEndereco(
                endereco
            );

        html += `
        <tr>
            <td>${endereco}</td>
            <td>${r.latitude}</td>
            <td>${r.longitude}</td>
            <td>${r.status}</td>
        </tr>
        `;

    }

    html += "</table>";

    document
        .getElementById("resultado")
        .innerHTML = html;
}

async function processarPlanilha(){

    const arquivo =
        document
        .getElementById("arquivoExcel")
        .files[0];

    if(!arquivo){

        alert(
            "Selecione uma planilha."
        );

        return;
    }

    document
        .getElementById("status")
        .innerText =
        "Lendo planilha...";

    resultadosPlanilha = [];

    const buffer =
        await arquivo.arrayBuffer();

    const workbook =
        XLSX.read(buffer);

    const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];

    const dados =
        XLSX.utils.sheet_to_json(
            sheet
        );

    const total =
        dados.length;

    let contador = 0;

    for(const linha of dados){

        contador++;

        document
        .getElementById("status")
        .innerText =
        `Processando ${contador} de ${total}`;

        const endereco =

            linha.endereco ||

            linha.Endereço ||

            linha.ENDERECO ||

            linha.ENDEREÇO ||

            linha.Nome ||

            linha.nome ||

            "";

        if(!endereco){

            resultadosPlanilha.push({

                WKT:"",
                Nome:"",
                Status:"sem_endereco"

            });

            continue;
        }

        const resultado =
            await geocodificarEndereco(
                endereco
            );

        const wkt =

            (
                resultado.longitude &&
                resultado.latitude
            )

            ?

            `POINT (${resultado.longitude} ${resultado.latitude})`

            :

            "";

        resultadosPlanilha.push({

            WKT:
                wkt,

            Nome:
                endereco,

            Status:
                resultado.status

        });

    }

    exibirResultados();

    exportarResultado();

    document
        .getElementById("status")
        .innerText =
        "Processamento concluído.";

}

function exibirResultados(){

    let html = `
    <table>
        <tr>
            <th>WKT</th>
            <th>Nome</th>
            <th>Status</th>
        </tr>
    `;

    resultadosPlanilha.forEach(item => {

        html += `
        <tr>
            <td>${item.WKT}</td>
            <td>${item.Nome}</td>
            <td>${item.Status}</td>
        </tr>
        `;

    });

    html += "</table>";

    document
        .getElementById("resultado")
        .innerHTML = html;

}

function exportarResultado(){

    const wb =
        XLSX.utils.book_new();

    const ws =
        XLSX.utils.json_to_sheet(
            resultadosPlanilha
        );

    XLSX.utils.book_append_sheet(
        wb,
        ws,
        "Pontos"
    );

    XLSX.writeFile(
        wb,
        "pontos_geocodificados.xlsx"
    );

}

</script>

</body>

</html>
