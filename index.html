<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Buscar Coordenadas</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

textarea{
    width:100%;
    height:200px;
}

button{
    padding:10px;
    margin:10px 5px;
}

table{
    border-collapse:collapse;
    width:100%;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}
</style>
</head>

<body>

<h2>Buscar Coordenadas</h2>

<p>Cole um endereço por linha:</p>

<textarea id="enderecos"></textarea>

<br>

<button onclick="buscarCoordenadas()">
Buscar Coordenadas
</button>

<div id="resultado"></div>

<script>

async function buscarCoordenadas() {

    const linhas =
        document
        .getElementById("enderecos")
        .value
        .split("\n")
        .filter(x => x.trim());

    let html =
    "<table><tr><th>Endereço</th><th>Latitude</th><th>Longitude</th></tr>";

    for(const endereco of linhas){

        try{

            const resposta = await fetch(
                "https://nominatim.openstreetmap.org/search?format=jsonv2&q=" +
                encodeURIComponent(endereco)
            );

            const dados = await resposta.json();

            if(dados.length > 0){

                html += `
                <tr>
                    <td>${endereco}</td>
                    <td>${dados[0].lat}</td>
                    <td>${dados[0].lon}</td>
                </tr>`;
            }

        }catch(e){

            html += `
            <tr>
                <td>${endereco}</td>
                <td>ERRO</td>
                <td>ERRO</td>
            </tr>`;
        }

    }

    html += "</table>";

    document.getElementById("resultado").innerHTML =
    html;
}

</script>

</body>
</html>
