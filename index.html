<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Geocodificador Mapbox</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

textarea{
    width:100%;
    height:250px;
}

button{
    padding:10px;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}
</style>
</head>

<body>

<h2>Buscar Coordenadas (Mapbox)</h2>

<p>Cole um endereço por linha:</p>

<textarea id="enderecos"></textarea>

<br>

<button onclick="buscarCoordenadas()">
Buscar Coordenadas
</button>

<div id="resultado"></div>

<script>

const TOKEN = "COLE_AQUI_SEU_TOKEN_COMPLETO";

async function buscarCoordenadas() {

    const linhas = document
        .getElementById("enderecos")
        .value
        .split("\n")
        .filter(x => x.trim());

    let html =
        "<table><tr><th>Endereço</th><th>Latitude</th><th>Longitude</th></tr>";

    for(const endereco of linhas){

        try{

            const url =
                `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(endereco)}.json?access_token=${TOKEN}&limit=1`;

            const resposta = await fetch(url);

            const dados = await resposta.json();

            if(dados.features.length){

                const lon = dados.features[0].center[0];
                const lat = dados.features[0].center[1];

                html += `
                <tr>
                    <td>${endereco}</td>
                    <td>${lat}</td>
                    <td>${lon}</td>
                </tr>`;
            }
            else{

                html += `
                <tr>
                    <td>${endereco}</td>
                    <td>Não encontrado</td>
                    <td>Não encontrado</td>
                </tr>`;
            }

        } catch(e){

            html += `
            <tr>
                <td>${endereco}</td>
                <td>Erro</td>
                <td>Erro</td>
            </tr>`;
        }

    }

    html += "</table>";

    document.getElementById("resultado").innerHTML = html;
}

</script>

</body>
</html>
